name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck jq

      - name: Shellcheck
        run: shellcheck -S warning scripts/*.sh tests/*.sh

      - name: Tests
        run: bash tests/pick-version.sh
